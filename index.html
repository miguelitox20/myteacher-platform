// ─── HELPERS ─────────────────────────────────────────────────────────────────
const MODE_BADGE = { Remoto: "badge-green", Híbrido: "badge-cyan", Presencial: "badge-orange" };
const TYPE_BADGE = { Práctica: "badge-blue", Pasantía: "badge-purple", "Tiempo Parcial": "badge-orange" };

function formatDate(d) {
  return new Date(d).toLocaleDateString("es-CO", { day: "numeric", month: "short", year: "numeric" });
}
function daysLeft(d) {
  const diff = Math.ceil((new Date(d) - new Date()) / 86400000);
  return diff;
}

// ─── COMPONENTS ──────────────────────────────────────────────────────────────
function Toast({ msg, onClose }) {
  useEffect(() => { const t = setTimeout(onClose, 3000); return () => clearTimeout(t); }, [onClose]);
  return <div className="toast"><Icon name="check" size={16} />{msg}</div>;
}

function OpportunitiesPage({ setPage, setSelectedOpp }) {
  const [search, setSearch] = useState("");
  const [types, setTypes] = useState([]);
  const [modes, setModes] = useState([]);
  const [sort, setSort] = useState("recent");

  const toggleFilter = (list, setList, val) => {
    setList(prev => prev.includes(val) ? prev.filter(v => v !== val) : [...prev, val]);
  };

  const allFilters = [...types.map(t => ({label:t,remove:()=>toggleFilter(types,setTypes,t)})), ...modes.map(m => ({label:m,remove:()=>toggleFilter(modes,setModes,m)}))];

  const filtered = OPPORTUNITIES
    .filter(o => {
      const q = search.toLowerCase();
      if (q && !o.title.toLowerCase().includes(q) && !o.company.toLowerCase().includes(q) && !o.location.toLowerCase().includes(q)) return false;
      if (types.length && !types.includes(o.type)) return false;
      if (modes.length && !modes.includes(o.mode)) return false;
      return true;
    })
    .sort((a,b) => sort === "recent" ? new Date(b.posted) - new Date(a.posted) : new Date(a.deadline) - new Date(b.deadline));

  return (
    <div className="page">
      <div className="page-header">
        <h1 className="page-title">Oportunidades laborales</h1>
        <p className="page-subtitle">{filtered.length} oportunidades disponibles para ti</p>
      </div>
      <div className="opps-layout">
        {/* SIDEBAR */}
        <aside className="sidebar">
          <div className="sidebar-title">Filtros</div>
          <div className="filter-group">
            <div className="filter-label">Tipo</div>
            {TYPES.map(t => (
              <label key={t} className={`checkbox-item${types.includes(t)?" active":""}`}>
                <input type="checkbox" checked={types.includes(t)} onChange={() => toggleFilter(types, setTypes, t)} />
                <span style={{fontSize:14,cursor:"pointer",color:types.includes(t)?"var(--blue)":"var(--text2)"}}>{t}</span>
              </label>
            ))}
          </div>
          <div className="filter-group">
            <div className="filter-label">Modalidad</div>
            {MODES.map(m => (
              <label key={m} className={`checkbox-item${modes.includes(m)?" active":""}`}>
                <input type="checkbox" checked={modes.includes(m)} onChange={() => toggleFilter(modes, setModes, m)} />
                <span style={{fontSize:14,cursor:"pointer",color:modes.includes(m)?"var(--blue)":"var(--text2)"}}>{m}</span>
              </label>
            ))}
          </div>
          {allFilters.length > 0 && (
            <button className="clear-all" onClick={() => { setTypes([]); setModes([]); }}>Limpiar todos los filtros</button>
          )}
        </aside>

        {/* MAIN */}
        <div className="opps-main">
          <div className="opps-toolbar">
            <div className="opps-search">
              <div className="input-wrapper">
                <Icon name="search" size={16} />
                <input className="input-search" placeholder="Buscar por cargo o empresa..." value={search} onChange={e => setSearch(e.target.value)} />
              </div>
            </div>
            <select className="select-sort" value={sort} onChange={e => setSort(e.target.value)}>
              <option value="recent">Más recientes</option>
              <option value="deadline">Próximos a vencer</option>
            </select>
          </div>

          {allFilters.length > 0 && (
            <div className="active-filters">
              <Icon name="filter" size={14} style={{color:"var(--text3)"}} />
              {allFilters.map((f,i) => (
                <span key={i} className="active-filter">
                  {f.label}
                  <button onClick={f.remove}><Icon name="x" size={12} /></button>
                </span>
              ))}
              <button className="clear-all" onClick={() => { setTypes([]); setModes([]); }}>Limpiar</button>
            </div>
          )}

          {filtered.length === 0 ? (
            <div className="no-results">
              <div className="no-results-icon">🔍</div>
              <p style={{fontWeight:600,fontSize:16,marginBottom:6}}>No encontramos resultados</p>
              <p style={{fontSize:14}}>Intenta con otros filtros o palabras clave</p>
            </div>
          ) : (
            <div className="opp-list">
              {filtered.map(opp => {
                const dl = daysLeft(opp.deadline);
                return (
                  <div key={opp.id} className="opp-list-card" onClick={() => { setSelectedOpp(opp); setPage("detail"); }}>
                    <div className="company-logo" style={{background:opp.color,width:48,height:48,borderRadius:12,flexShrink:0,display:"flex",alignItems:"center",justifyContent:"center",fontFamily:"Syne, sans-serif",fontWeight:800,fontSize:14,color:"#fff"}}>{opp.logo}</div>
                    <div className="opp-list-body">
                      <div className="opp-list-title">{opp.title}</div>
                      <div className="opp-list-company">
                        <Icon name="building" size={13} />{opp.company}
                        <span style={{color:"var(--text3)"}}>·</span>
                        <Icon name="map" size={13} />{opp.location}
                      </div>
                      <div className="card-badges" style={{marginBottom:8}}>
                        <span className={`badge ${TYPE_BADGE[opp.type]}`}>{opp.type}</span>
                        <span className={`badge ${MODE_BADGE[opp.mode]}`}>{opp.mode}</span>
                      </div>
                      <div className="opp-list-footer">
                        <div style={{display:"flex",gap:16,flexWrap:"wrap",alignItems:"center"}}>
                          <span style={{fontFamily:"Syne, sans-serif",fontSize:15,fontWeight:700,color:"var(--green)"}}>{opp.salary}<span style={{fontSize:11,fontWeight:400,color:"var(--text3)"}}>/mes</span></span>
                          <span style={{fontSize:13,color:dl < 10 ? "var(--red)" : "var(--text3)",display:"flex",alignItems:"center",gap:4}}>
                            <Icon name="clock" size={13} />{dl < 0 ? "Vencido" : dl === 0 ? "Vence hoy" : `${dl} días restantes`}
                          </span>
                        </div>
                        <button className="btn-sm" onClick={e => { e.stopPropagation(); setSelectedOpp(opp); setPage("detail"); }}>Ver detalles →</button>
                      </div>
                    </div>
                  </div>
                );
              })}
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

function DetailPage({ opp, setPage, showToast, applications, setApplications, savedIds, toggleSave }) {
  const [applied, setApplied] = useState(applications.some(a => a.id === opp?.id));
  const [modal, setModal] = useState(false);

  useEffect(() => {
    const onKeyDown = (e) => {
      if (e.key === "Escape") setModal(false);
    };
    if (modal) window.addEventListener("keydown", onKeyDown);
    return () => window.removeEventListener("keydown", onKeyDown);
  }, [modal]);
  if (!opp) { setPage("opportunities"); return null; }
  const dl = daysLeft(opp.deadline);

  const handleApply = () => {
    if (applied) return;
    setApplications(prev => [...prev, { ...opp, status: "pending", appliedDate: new Date().toISOString(), step: 0 }]);
    setApplied(true);
    setModal(false);
    showToast(`¡Aplicaste a ${opp.title} en ${opp.company}!`);
  };

  return (
    <div className="page">
      <div style={{marginBottom:16}}>
        <button onClick={() => setPage("opportunities")} style={{background:"none",border:"none",cursor:"pointer",color:"var(--blue)",fontWeight:600,fontSize:14,display:"flex",alignItems:"center",gap:6}}>
          ← Volver a oportunidades
        </button>
      </div>
      <div className="detail-layout">
        <div className="detail-main">
          <div className="detail-header">
            <div className="detail-logo" style={{background:opp.color}}>{opp.logo}</div>
            <div>
        <h1 className="detail-title">{opp.title}</h1>
              <div className="detail-company">{opp.company}</div>
              <div style={{display:"flex",gap:8,marginTop:10,flexWrap:"wrap"}}>
                <span className={`badge ${TYPE_BADGE[opp.type]}`}>{opp.type}</span>
                <span className={`badge ${MODE_BADGE[opp.mode]}`}>{opp.mode}</span>
              </div>
            </div>
          </div>

          <div className="detail-meta-grid">
            <div className="detail-meta-item"><label>Ubicación</label><p>{opp.location}</p></div>
            <div className="detail-meta-item"><label>Salario</label><p style={{color:"var(--green)"}}>{opp.salary}/mes</p></div>
            <div className="detail-meta-item"><label>Fecha límite</label><p>{formatDate(opp.deadline)}</p></div>
            <div className="detail-meta-item"><label>Categoría</label><p>{opp.category}</p></div>
          </div>

          <div className="detail-section">
            <h3>Descripción del puesto</h3>
            <p>{opp.description}</p>
          </div>

          <div className="detail-section">
            <h3>Habilidades requeridas</h3>
            <div className="req-list">
              {opp.requirements.map(r => <span key={r} className="req-tag">{r}</span>)}
            </div>
          </div>

          <div className="detail-section">
            <h3>Sobre {opp.company}</h3>
            <p>Una de las empresas líderes en su sector en Colombia, comprometida con el desarrollo del talento joven y la innovación. Ofrecemos un ambiente dinámico, mentoría de clase mundial y la oportunidad de impactar millones de personas.</p>
          </div>
        </div>

        <div className="detail-sidebar">
          <div style={{marginBottom:16}}>
            <div style={{fontSize:22,fontFamily:"Syne, sans-serif",fontWeight:800,color:"var(--green)",marginBottom:2}}>{opp.salary}<span style={{fontSize:13,fontWeight:400,color:"var(--text3)"}}>/mes</span></div>
            <div style={{fontSize:13,color:"var(--text3)"}}>{opp.type} · {opp.mode}</div>
          </div>
          <button className="btn-apply" onClick={() => applied ? null : setModal(true)} disabled={applied} style={applied ? {opacity:.7,cursor:"default"} : {}}>
            {applied ? "✓ Aplicación enviada" : "Aplicar ahora"}
          </button>
          <button
            className="btn-save"
            onClick={() => toggleSave(opp)}
            aria-pressed={savedIds && savedIds.has(opp?.id)}
            style={savedIds && savedIds.has(opp?.id) ? { background: "var(--blue-pale)", color: "var(--blue)" } : {}}
          >
            {savedIds && savedIds.has(opp?.id) ? "✓ Guardada" : "Guardar oportunidad"}
          </button>
          {dl > 0 && dl <= 7 && (
            <div className="deadline-warning"><Icon name="clock" size={14} />Quedan solo {dl} días</div>
          )}
          <div style={{marginTop:20,paddingTop:16,borderTop:"1px solid var(--border)"}}>
            <div style={{fontSize:12,color:"var(--text3)",fontWeight:700,textTransform:"uppercase",letterSpacing:".05em",marginBottom:10}}>Detalles rápidos</div>
            {[["Publicado",formatDate(opp.posted)],["Modalidad",opp.mode],["Tipo",opp.type]].map(([k,v]) => (
              <div key={k} style={{display:"flex",justifyContent:"space-between",fontSize:13,marginBottom:8}}>
                <span style={{color:"var(--text3)"}}>{k}</span>
                <span style={{fontWeight:600}}>{v}</span>
              </div>
            ))}
          </div>
        </div>
      </div>

      {modal && (
        <div className="modal-overlay" role="dialog" aria-modal="true" onClick={() => setModal(false)}>
          <div className="modal" onClick={e => e.stopPropagation()}>
            <h2>Confirmar aplicación</h2>
            <p>¿Deseas enviar tu aplicación para <strong>{opp.title}</strong> en <strong>{opp.company}</strong>? Se compartirá tu perfil y CV.</p>
            <div className="modal-actions">
              <button className="btn-outline" onClick={() => setModal(false)}>Cancelar</button>
              <button className="btn-primary" onClick={handleApply}>Confirmar y aplicar</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

function ApplicationsPage({ applications, setPage, setSelectedOpp }) {
  const STATUS_LABELS = { pending: "Enviada", review: "En revisión", interview: "Entrevista", rejected: "No seleccionado" };
  const STATUS_STEPS = { pending: 1, review: 2, interview: 3, rejected: 0 };
  const STEPS_TOTAL = 3;

  if (applications.length === 0) return (
    <div className="page" style={{textAlign:"center",padding:"80px 24px"}}>
      <div style={{fontSize:56,marginBottom:16}}>📋</div>
      <h2 style={{marginBottom:8}}>No tienes aplicaciones aún</h2>
      <p style={{color:"var(--text2)",marginBottom:24}}>Explora las oportunidades disponibles y empieza a aplicar.</p>
      <button className="btn-primary" onClick={() => setPage("opportunities")}>Ver oportunidades</button>
    </div>
  );

  return (
    <div className="page" style={{maxWidth:760}}>
      <div className="page-header">
        <h1 className="page-title">Mis Aplicaciones</h1>
        <p className="page-subtitle">{applications.length} aplicaciones enviadas</p>
      </div>
      {applications.map((app, i) => {
        const steps = STATUS_STEPS[app.status] || 1;
        return (
          <div key={i} className="app-card">
            <div className="company-logo" style={{background:app.color,width:48,height:48,borderRadius:12,flexShrink:0,display:"flex",alignItems:"center",justifyContent:"center",fontFamily:"Syne, sans-serif",fontWeight:800,fontSize:14,color:"#fff"}}>{app.logo}</div>
            <div style={{flex:1,minWidth:0}}>
              <div style={{display:"flex",alignItems:"flex-start",justifyContent:"space-between",gap:12,flexWrap:"wrap",marginBottom:4}}>
                <div>
                  <div style={{fontFamily:"Syne, sans-serif",fontWeight:700,fontSize:16}}>{app.title}</div>
                  <div style={{fontSize:13,color:"var(--text2)",marginTop:2}}>{app.company} · {app.location}</div>
                </div>
                <span className={`app-status status-${app.status}`}>{STATUS_LABELS[app.status]}</span>
              </div>
              <div style={{fontSize:12,color:"var(--text3)",marginBottom:10}}>Aplicado el {formatDate(app.appliedDate || new Date())}</div>
              {app.status !== "rejected" && (
                <>
                  <div style={{display:"flex",gap:4,marginBottom:4}}>
                    {["Aplicada","En revisión","Entrevista"].map((s,idx) => (
                      <div key={s} style={{flex:1,height:5,borderRadius:999,background:idx < steps ? "var(--blue)" : idx === steps-1 ? "var(--accent)" : "var(--border)",transition:"background .3s"}} />
                    ))}
                  </div>
                  <div style={{display:"flex",justifyContent:"space-between",fontSize:11,color:"var(--text3)"}}>
                    {["Aplicada","En revisión","Entrevista"].map(s => <span key={s}>{s}</span>)}
                  </div>
                </>
              )}
              <div style={{marginTop:12}}>
                <button className="btn-sm" onClick={() => { setSelectedOpp(app); setPage("detail"); }}>Ver oferta</button>
              </div>
            </div>
          </div>
        );
      })}
    </div>
  );
}

// ─── APP ─────────────────────────────────────────────────────────────────────
function ConectaEstudia() {
  const [page, setPage] = useState("home");
  const [dark, setDark] = useState(false);
  const [selectedOpp, setSelectedOpp] = useState(null);
  const [toastMsg, setToastMsg] = useState(null);
  const [savedIds, setSavedIds] = useState(() => new Set());

  const toggleSave = (opp) => {
    if (!opp) return;
    setSavedIds((prev) => {
      const next = new Set(prev);
      if (next.has(opp.id)) next.delete(opp.id);
      else next.add(opp.id);
      return next;
    });
  };
  const [applications, setApplications] = useState([
    { ...OPPORTUNITIES[2], status: "review", appliedDate: "2025-05-10" },
    { ...OPPORTUNITIES[5], status: "pending", appliedDate: "2025-05-20" },
  ]);

  const showToast = useCallback((msg) => setToastMsg(msg), []);

  useEffect(() => {
    document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
  }, [dark]);

  return (
    <>
      <style>{globalStyles}</style>
      <div className="app">
        <Navbar page={page} setPage={setPage} dark={dark} setDark={setDark} />
        <main className="main">
          {page === "home" && <HomePage setPage={setPage} setSelectedOpp={setSelectedOpp} toast={showToast} />}
          {page === "opportunities" && <OpportunitiesPage setPage={setPage} setSelectedOpp={setSelectedOpp} />}
          {page === "detail" && (
            <DetailPage
              opp={selectedOpp}
              setPage={setPage}
              showToast={showToast}
              applications={applications}
              setApplications={setApplications}
              savedIds={savedIds}
              toggleSave={toggleSave}
            />
          )}
          {page === "profile" && <ProfilePage />}
          {page === "applications" && <ApplicationsPage applications={applications} setPage={setPage} setSelectedOpp={setSelectedOpp} />}
        </main>
        <BottomNav page={page} setPage={setPage} />
        {toastMsg && <Toast msg={toastMsg} onClose={() => setToastMsg(null)} />}
      </div>
    </>
  );
}

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<ConectaEstudia />);
  </script>
</body>
